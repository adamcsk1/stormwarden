{{define "metrics.html"}}{{if .Samples}}<div class="table-wrap"><table><thead><tr><th>Time</th><th>Probe</th><th>Target</th><th>Result</th><th>Duration</th><th>TTFB</th><th>Speed</th></tr></thead><tbody>{{range .Samples}}<tr><td>{{localTime .CreatedAt}}</td><td>{{.ProbeType}}</td><td class="target">{{.Target}}</td><td><span class="badge {{.Severity}}">{{.Severity}}</span></td><td>{{f1 .DurationMS}} ms</td><td>{{f1 .TTFBMS}} ms</td><td>{{if .Mbps}}{{f1 .Mbps}} Mbps{{else}}—{{end}}</td></tr>{{end}}</tbody></table></div>{{else}}<p class="empty">No measurements yet.</p>{{end}}{{end}}
