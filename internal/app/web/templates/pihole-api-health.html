{{define "pihole-api-health.html"}}<section id="pihole-api-health" class="pihole-health" role="status" aria-live="polite">{{template "pihole-api-health-content.html" .}}</section>{{end}}{{define "pihole-api-health-content.html"}}<div class="pihole-health-heading"><strong>Pi-hole API</strong><span class="badge {{.Severity}}">{{.State}}</span></div><p>{{.Message}}</p>{{if .HasChecked}}<small class="muted">Last checked: {{localTime .CheckedAt}}</small>{{end}}<form hx-post="/ui/pihole-api-health" hx-target="#pihole-api-health" hx-swap="innerHTML" hx-disabled-elt="find button"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="quiet" type="submit" {{if not .Configured}}disabled{{end}}>{{if .Checking}}Wait for result{{else if .HasChecked}}Recheck{{else}}Check connection{{end}}</button></form>{{end}}
