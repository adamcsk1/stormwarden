{{define "dns-paths.html"}}<div class="dns-path-grid">{{range .Paths}}<article class="dns-path"><span>{{.Label}}</span>{{if .Sample}}<strong>{{f1 .Sample.DurationMS}} ms</strong>{{if .Stale}}<span class="badge warning">stale</span>{{else}}<span class="badge {{.Sample.Severity}}">{{.Sample.Severity}}</span>{{end}}<small>{{.Sample.Message}}</small><small>{{localTime .Sample.CreatedAt}}</small>{{else}}<strong>Waiting</strong><small>No measurement yet</small>{{end}}</article>{{end}}</div>{{end}}
