{{define "settings.html"}}<div class="settings-content">{{if .Saved}}<p class="alert success">Settings updated.</p>{{end}}{{template "pihole-api-health.html" .PiHoleHealth}}<form hx-post="/ui/settings" hx-target="closest .settings-content" hx-swap="outerHTML"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Traffic profile<select name="profile"><option value="minimal" {{if eq .Profile "minimal"}}selected{{end}}>Minimal · no transfer tests</option><option value="low" {{if eq .Profile "low"}}selected{{end}}>Low · ~0.75 GB/month</option><option value="detailed" {{if eq .Profile "detailed"}}selected{{end}}>Detailed · ~15 GB/month</option></select></label><label>Asset probes · one entry per line<textarea name="asset_targets" rows="7" placeholder="YouTube thumbnail|https://i.ytimg.com/vi/VIDEO_ID/hqdefault.jpg">{{.AssetTargets}}</textarea></label><small class="muted">Name|URL runs every 30s. Name|cache-bust|URL adds a random query every 5m. Downloads stop after 512 KiB.</small><button type="submit">Save settings</button></form></div>{{end}}
