{{define "settings.html"}}{{if .Saved}}<p class="alert success">Settings updated.</p>{{end}}<form hx-post="/ui/settings" hx-target="this" hx-swap="outerHTML"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Traffic profile<select name="profile"><option value="minimal" {{if eq .Profile "minimal"}}selected{{end}}>Minimal · no transfer tests</option><option value="low" {{if eq .Profile "low"}}selected{{end}}>Low · ~0.75 GB/month</option><option value="detailed" {{if eq .Profile "detailed"}}selected{{end}}>Detailed · ~15 GB/month</option></select></label><label>Asset probes · one Name|URL per line<textarea name="asset_targets" rows="6" placeholder="YouTube thumbnail|https://i.ytimg.com/vi/VIDEO_ID/hqdefault.jpg">{{.AssetTargets}}</textarea></label><small class="muted">Loaded every 30 seconds, up to 512 KiB per asset (~45 GB/month each at the cap). Use small, stable image URLs.</small><button type="submit">Save settings</button></form>{{end}}
