{{define "smtp-health.html"}}<section id="smtp-health" class="pihole-health" role="status" aria-live="polite">{{template "smtp-health-content.html" .}}</section>{{end}}{{define "smtp-health-content.html"}}<div class="pihole-health-heading"><strong>SMTP</strong><span class="badge {{.Severity}}">{{.State}}</span></div><p>{{.Message}}</p>{{if .HasChecked}}<small class="muted">Last checked: {{localTime .CheckedAt}}</small>{{end}}<form hx-post="/ui/smtp-health" hx-target="#smtp-health" hx-swap="innerHTML" hx-disabled-elt="find button"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="quiet" type="submit" {{if not .Configured}}disabled{{end}}>{{if .HasChecked}}Send again{{else}}Send test email{{end}}</button></form>{{end}}
