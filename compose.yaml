name: stormwarden

services:
  stormwarden:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      PIHOLE_DNS_ADDR: ${PIHOLE_DNS_ADDR:?set PIHOLE_DNS_ADDR in .env}
      PIHOLE_API_URL: ${PIHOLE_API_URL:-}
      PIHOLE_API_PASSWORD: ${PIHOLE_API_PASSWORD:-}
      PIHOLE_API_ALLOW_INSECURE_HTTP: ${PIHOLE_API_ALLOW_INSECURE_HTTP:-false}
      PUBLIC_DNS_ADDR: ${PUBLIC_DNS_ADDR:-1.1.1.1:53}
      DOH_PROBE_URL: ${DOH_PROBE_URL:-https://1.1.1.1/dns-query}
      HTTP_DNS_ADDR: ${HTTP_DNS_ADDR:-${PIHOLE_DNS_ADDR}}
      HTTP_PROBE_URL: ${HTTP_PROBE_URL:-https://www.google.com/generate_204}
      TRANSFER_PROBE_URL: ${TRANSFER_PROBE_URL:-https://speed.cloudflare.com/__down?bytes=262144}
      ASSET_PROBES: ${ASSET_PROBES:-YouTube thumbnail|https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg;Cloudflare cache-busted|cache-bust|https://speed.cloudflare.com/__down?bytes=32768}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Budapest}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_LISTEN_ADDR: :8080
      HTTP_EXPECTED_STATUS: ${HTTP_EXPECTED_STATUS:-204}
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true

